# ===================================================================
# MICROSERVIZIO TRENO - Configurazione
# ===================================================================
# Lo legge la classe Configurazione. Ogni chiave si puo' sovrascrivere al lancio con -D
# (es. -Dmqtt.port=1884), e le righe che cominciano con %tls. valgono solo quando si lancia
# con -Dprofilo=tls: stessa convenzione di Stazioni e Centrale.

# Ogni istanza di treno ha un ID univoco (es: "REG-1234", "AV-9876").
# Di norma arriva come primo argomento: java -jar target/treno.jar AV-9876
# Questo valore si usa solo se l'argomento manca.
treno.id=TRN001

# Porta delle API REST del treno (diversa per ogni microservizio per evitare conflitti)
http.port=8082

# ---------------------------------------------------------------
# DIGITAL TWIN DEL VIAGGIO (GeneratoreEventiTempo, GestoreEventi, AutomaViaggio)
# ---------------------------------------------------------------
# URL della Centrale Operativa da cui scaricare l'itinerario del treno.
# In profilo di default la Centrale espone solo HTTP sulla 8781; la 8444 in HTTPS
# esiste soltanto sotto il profilo tls (vedi override %tls.centrale.url in fondo).
centrale.url=http://localhost:8781
# Durata della sosta in stazione (secondi reali; all'estremo dell'itinerario, dove si
# inverte la marcia, è doppia)
viaggio.sosta.secondi=2
# Fattore di accelerazione della simulazione: 1 minuto simulato = 60/fattore secondi reali
viaggio.fattore.accelerazione=100
# Se true il viaggio parte automaticamente appena l'itinerario è caricato
viaggio.autostart=true

# ---------------------------------------------------------------
# Connessione al broker Mosquitto (ClientMqtt)
# ---------------------------------------------------------------
# Il treno apre UNA connessione, con client-id treno-<ID>, e su quella:
#   pubblica   railway/train/<ID>/validation        (richiesta di verifica dell'ID, QoS 0)
#              railway/train/<ID>/telemetry         (telemetria ogni secondo, QoS 0)
#              railway/treno-simulatoriSensori/<ID> (passaggi ENTRATA/USCITA, QoS 0)
#              railway/alerts                       (guasti di bordo, QoS 1)
#   ascolta    railway/train/+/validation-response  (risposta della Centrale, QoS 0)
#              railway/alerts                       (alert della Centrale, QoS 1)
# Sugli alert il QoS non e' lo 0 di default: sono gli unici messaggi che passano una volta
# sola e che nessuno ripete (GUASTO, RESOLVED, STOP, ITINERARIO_AGGIORNATO). Uno di questi
# perduto significa un convoglio che entra in una stazione inagibile o che resta fermo per
# un guasto gia' risolto, quindi qos=1 e sessione persistente. Il criterio completo e'
# commentato nell'application.properties della Centrale.
mqtt.host=localhost
mqtt.port=1883

# ---------------------------------------------------------------
# LOG
# ---------------------------------------------------------------
# Quello che si vede a schermo deve restare leggibile durante una prova: si tengono gli
# eventi del viaggio (partenze, arrivi, alert che riguardano questo treno) e sparisce
# cio' che si ripete sempre uguale. La telemetria (una ogni secondo) e gli alert diretti
# ad altri treni sono in DEBUG: per rileggerli basta mettere true (o lanciare con
# -Dlog.debug=true).
log.debug=false

# ===================================================================
# PROFILO TLS (variante 6 del prof) - attivare con -Dprofilo=tls
# I certificati vanno prima generati con BrokerMosquitto/tls/gen-certs.sh;
# i path sono relativi alla directory di questo servizio.
# ===================================================================
# CA privata del progetto: e' l'unica di cui il treno si fida, per il broker, per la
# Centrale e per le proprie API (console dei sensori). Vedi ContestoTls.
tls.ca.path=../BrokerMosquitto/tls/certs/ca.crt

# MQTT cifrato verso il broker sulla 8883 (ssl:// invece di tcp://)
%tls.mqtt.port=8883

# Sotto questo profilo la Centrale espone l'HTTPS sulla 8444 (%tls.quarkus.http.ssl-port
# nel suo application.properties): il download dell'itinerario passa quindi da TLS,
# validato contro la CA privata indicata in tls.ca.path.
%tls.centrale.url=https://localhost:8444

# Le API REST del treno rispondono solo in HTTPS, sulla stessa http.port, con un
# certificato firmato dalla CA del progetto (vedi ServerRest).
http.tls.cert.path=../BrokerMosquitto/tls/certs/server-treno.crt
http.tls.key.path=../BrokerMosquitto/tls/certs/server-treno.key
