#Il file application.properties non appartiene a un singolo framework in esclusiva, ma è diventato una convenzione standard nell'ecosistema Java moderno per definire le configurazioni di un'applicazione.

#Nel contesto del codice che hai mostrato prima (dove usi SmallRye Mutiny e MicroProfile), stai utilizzando Quarkus.

#Ecco come viene utilizzato nei framework principali:



# ===================================================================
# MICROSERVIZIO TRENO - Configurazione MQTT
# ===================================================================
# Ogni istanza di treno ha un ID univoco (es: "REG-1234", "AV-9876")
# Puoi sovrascrivere con -Dtreno.id=AV-9876 al lancio
treno.id=TRN001

# Porta HTTP Quarkus (diversa per ogni microservizio per evitare conflitti)
quarkus.http.port=8082

# ---------------------------------------------------------------
# DIGITAL TWIN DEL VIAGGIO (TrainJourneyEngine)
# ---------------------------------------------------------------
# URL della Centrale Operativa da cui scaricare l'itinerario del treno.
# In profilo di default la Centrale espone solo HTTP sulla 8781; la 8444 in HTTPS
# esiste soltanto sotto il profilo tls (vedi override %tls.centrale.url in fondo).
centrale.url=http://localhost:8781
centrale.tls.ca.path=../BrokerMosquitto/tls/certs/ca.crt
# Durata della sosta in stazione (secondi reali; al capolinea è doppia)
viaggio.sosta.secondi=20
# Fattore di accelerazione della simulazione: 1 minuto simulato = 60/fattore secondi reali
viaggio.fattore.accelerazione=10
# Se true il viaggio parte automaticamente appena l'itinerario è caricato
viaggio.autostart=true

# ---------------------------------------------------------------


# Connessione al broker Mosquitto
# ---------------------------------------------------------------
mqtt.host=localhost
mqtt.port=1883


# Invio della richiesta di verifica (OUT)
mp.messaging.outgoing.validation-request-out.connector=smallrye-mqtt
mp.messaging.outgoing.validation-request-out.topic=railway/train/${treno.id}/validation
mp.messaging.outgoing.validation-request-out.host=${mqtt.host}
mp.messaging.outgoing.validation-request-out.port=${mqtt.port}

# Ricezione della risposta dal server (IN)
mp.messaging.incoming.validation-response-in.connector=smallrye-mqtt
mp.messaging.incoming.validation-response-in.topic=railway/train/+/validation-response
mp.messaging.incoming.validation-response-in.host=${mqtt.host}
mp.messaging.incoming.validation-response-in.port=${mqtt.port}



# ---------------------------------------------------------------
# CANALE IN USCITA: telemetria/posizione del treno
# Pubblica su: railway/train/{treno.id}/telemetry
# ---------------------------------------------------------------
mp.messaging.outgoing.telemetry-out.connector=smallrye-mqtt
mp.messaging.outgoing.telemetry-out.topic=railway/train/${treno.id}/telemetry
mp.messaging.outgoing.telemetry-out.host=${mqtt.host}
mp.messaging.outgoing.telemetry-out.port=${mqtt.port}

# ---------------------------------------------------------------
# CANALE IN INGRESSO: riceve alert/comandi dalla Centrale
# Si sottoscrive a: railway/alerts
# ---------------------------------------------------------------
# INCOMING: alerts from Centrale
mp.messaging.incoming.alerts-in.connector=smallrye-mqtt
mp.messaging.incoming.alerts-in.topic=railway/alerts
mp.messaging.incoming.alerts-in.host=${mqtt.host}
mp.messaging.incoming.alerts-in.port=${mqtt.port}

# OUTGOING: alerts towards Centrale
mp.messaging.outgoing.alerts-out.connector=smallrye-mqtt
mp.messaging.outgoing.alerts-out.topic=railway/alerts
mp.messaging.outgoing.alerts-out.host=${mqtt.host}
mp.messaging.outgoing.alerts-out.port=${mqtt.port}

# OUTGOING: passaggio stations
mp.messaging.outgoing.passaggio-out.connector=smallrye-mqtt
mp.messaging.outgoing.passaggio-out.topic=railway/train/${treno.id}/passaggio
mp.messaging.outgoing.passaggio-out.host=${mqtt.host}
mp.messaging.outgoing.passaggio-out.port=${mqtt.port}

# ===================================================================
# PROFILO TLS (variante 6 del prof) - attivare con -Dquarkus.profile=tls
# Cifra tutti i canali MQTT verso il broker (porta 8883).
# I certificati vanno prima generati con BrokerMosquitto/tls/gen-certs.sh;
# il path del truststore e' relativo alla directory di questo servizio.
# ===================================================================
%tls.mqtt.port=8883

# Sotto questo profilo la Centrale espone l'HTTPS sulla 8444 (%tls.quarkus.http.ssl-port
# nel suo application.properties): il download dell'itinerario passa quindi da TLS,
# validato contro la CA privata indicata in centrale.tls.ca.path.
%tls.centrale.url=https://localhost:8444

# Ogni canale MQTT valida il certificato del broker contro la CA del progetto.
# ATTENZIONE: vanno elencati TUTTI i canali, compresi quelli di validazione dell'ID:
# sotto profilo tls la porta diventa 8883 per tutti, e un canale senza ssl=true
# aprirebbe una socket in chiaro su un listener TLS (handshake fallito -> il treno
# non riesce a validarsi e resta bloccato nel loop di main.run()).
%tls.mp.messaging.outgoing.validation-request-out.ssl=true
%tls.mp.messaging.outgoing.validation-request-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.validation-request-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.validation-response-in.ssl=true
%tls.mp.messaging.incoming.validation-response-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.validation-response-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.outgoing.telemetry-out.ssl=true
%tls.mp.messaging.outgoing.telemetry-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.telemetry-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.alerts-in.ssl=true
%tls.mp.messaging.incoming.alerts-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.alerts-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.outgoing.alerts-out.ssl=true
%tls.mp.messaging.outgoing.alerts-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.alerts-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.outgoing.passaggio-out.ssl=true
%tls.mp.messaging.outgoing.passaggio-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.passaggio-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt
