# Use a random available port for Quarkus tests to avoid port conflicts with running services.
quarkus.http.test-port=0

# Provide the project CA certificate path so the secure HTTP client can initialize during tests.
centrale.tls.ca.path=../BrokerMosquitto/tls/certs/ca.crt

# La persistenza locale nei test scrive dentro target/, che viene ripulita da "mvn clean":
# cosi' il db di prova non si mischia con quello vero del nodo (Stazioni/data/).
stazione.db.path=target/stazione-test.db
