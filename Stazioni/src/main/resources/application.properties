# ===================================================================
# MICROSERVIZIO STAZIONE - Configurazione
# ===================================================================
# Lo legge la classe Configurazione. Ogni chiave si puo' sovrascrivere al lancio con -D
# (es. -Dhttp.port=8085), e le righe che cominciano con %tls. valgono solo quando si lancia
# con -Dprofilo=tls: stessa convenzione del nodo Treno.

# Ogni istanza di stazione ha un ID univoco (es: "MI", "TO").
# Di norma arriva come primo argomento: java -jar target/stazione.jar MI
# Questo valore si usa solo se l'argomento manca.
stazione.id=S1

# Porta delle API REST della stazione, quelle che chiamano i sensori di binario
# (avvioStazioni.sh ne da' una diversa a ogni istanza, a partire dalla 8080)
http.port=8081

# ---------------------------------------------------------------
# PERSISTENZA LOCALE (SQLite)
# ---------------------------------------------------------------
# Il nodo tiene il proprio stato anche su un file SQLite, cosi' un riavvio (o un
# blackout) non gli fa perdere lo stato GUASTA, i treni fermi sui binari e gli
# eventi non ancora spediti alla Centrale. Lo schema e' in resources/schema.sql.
# Il file e' data/stazione-<ID>.db: l'id della stazione sta nel nome perche' sulla
# stessa macchina girano piu' stazioni, e con un file solo si darebbero lo stato a
# vicenda. Per metterlo altrove si lancia con -Dstazione.db.path=...
#
# Messa a false la stazione riparte sempre pulita, come prima di avere il db
# (comodo per le prove: evita di dover cancellare il file a mano).
stazione.db.abilitata=true

# ---------------------------------------------------------------
# Connessione al broker Mosquitto (ClientMqtt)
# ---------------------------------------------------------------
# La stazione apre UNA connessione, con client-id stazione-<ID>, e su quella:
#   pubblica   railway/station/<ID>/validation         (richiesta di verifica dell'ID, QoS 0)
#              railway/station/<ID>/heartbeat          (heartbeat ogni 10 secondi, QoS 0)
#              railway/station/<ID>/transit            (transiti ENTRATA/USCITA, QoS 0)
#              railway/alerts                          (guasti e ripristini, QoS 1)
#   ascolta    railway/station/+/validation-response   (risposta della Centrale, QoS 0)
#              railway/alerts                          (alert della Centrale, QoS 1)
#              railway/treno-simulatoriSensori/+       (passaggi dei treni, per i sensori, QoS 0)
# Sugli alert il QoS non e' lo 0 di default: gli alert passano una volta sola e nessuno
# li ripete, quindi qos=1 (con PUBACK e ritrasmissione) e sessione persistente, cosi' un
# RESOLVED pubblicato mentre il nodo era spento gli arriva comunque alla riconnessione
# invece di lasciarlo GUASTA per sempre. Il criterio completo e' commentato
# nell'application.properties della Centrale.
# Il client-id contiene l'ID perche' le istanze di questo servizio sono piu' di una:
# due nodi con lo stesso identificativo si scollegherebbero a vicenda.
mqtt.host=localhost
mqtt.port=1883

# ---------------------------------------------------------------
# SENSORI DI BINARIO (heartbeat + fail-stop)
# ---------------------------------------------------------------
# Il binario sorvegliato: per ora ce n'e' uno solo, quindi i sensori simulati
# sono due (uno in ingresso e uno in uscita, id <stazione>-BIN1-IN/-OUT).
stazione.binario=1

# Ogni quanti secondi i sensori simulati mandano il proprio keepalive alla stazione
# (POST /stazione/sensore/heartbeat). Deve restare molto piu' corto del timeout
# qui sotto, se no un sensore sano verrebbe dichiarato guasto solo perche' non
# ha ancora fatto in tempo a battere.
sensori.heartbeat.secondi=5

# Ogni quanti secondi la stazione controlla se i battiti stanno arrivando.
sensori.controllo.secondi=5

# Keepalive sensori: dopo quanti secondi senza battito un sensore
# viene considerato guasto e la stazione si dichiara GUASTA alla Centrale.
# Con 30s la prova dalla CLI dura poco ma non e' nemmeno istantanea.
sensori.timeout.secondi=30

# ---------------------------------------------------------------
# LOG
# ---------------------------------------------------------------
# Quello che si vede a schermo deve restare leggibile durante una prova: si tengono gli
# eventi (transiti, guasti, alert che riguardano questa stazione) e sparisce cio' che si
# ripete sempre uguale. L'heartbeat (uno ogni 10s) e il payload grezzo degli alert sono
# in DEBUG: per rileggerli basta mettere true (o lanciare con -Dlog.debug=true).
log.debug=false

# ===================================================================
# PROFILO TLS (variante 6 del prof) - attivare con -Dprofilo=tls
# I certificati vanno prima generati con BrokerMosquitto/tls/gen-certs.sh;
# i path sono relativi alla directory di questo servizio.
# ===================================================================
# CA privata del progetto: e' l'unica di cui la stazione si fida, per il broker e per le
# proprie API (i sensori simulati e la console le chiamano in HTTPS). Vedi ContestoTls.
tls.ca.path=../BrokerMosquitto/tls/certs/ca.crt

# MQTT cifrato verso il broker sulla 8883 (ssl:// invece di tcp://)
%tls.mqtt.port=8883

# Le API REST della stazione rispondono solo in HTTPS, sulla stessa http.port, con un
# certificato firmato dalla CA del progetto (vedi ServerRest).
http.tls.cert.path=../BrokerMosquitto/tls/certs/server-stazione.crt
http.tls.key.path=../BrokerMosquitto/tls/certs/server-stazione.key
