# ===================================================================
# MICROSERVIZIO STAZIONE - Configurazione MQTT
# ===================================================================
# Ogni istanza di stazione ha un ID univoco (es: "alessandria", "torino")
# Puoi sovrascrivere con -Dstazione.id=torino al lancio
stazione.id=S1

# ---------------------------------------------------------------
# Centrale Operativa: URL e certificato CA per TLS
# ---------------------------------------------------------------
# In profilo di default la Centrale espone solo HTTP sulla 8781; la 8444 in HTTPS
# esiste soltanto sotto il profilo tls (vedi override %tls.centrale.url in fondo).
centrale.url=http://localhost:8781
centrale.tls.ca.path=../BrokerMosquitto/tls/certs/ca.crt

# Porta HTTP Quarkus (diversa per ogni microservizio per evitare conflitti)
quarkus.http.port=8081

# ---------------------------------------------------------------
# Connessione al broker Mosquitto
# ---------------------------------------------------------------
mqtt.host=localhost
mqtt.port=1883

# ---------------------------------------------------------------
# VERIFICA ID STAZIONE via MQTT (stesso pattern del Treno)
# ---------------------------------------------------------------
# Invio della richiesta di verifica (OUT)
mp.messaging.outgoing.validation-request-out.connector=smallrye-mqtt
mp.messaging.outgoing.validation-request-out.topic=railway/station/${stazione.id}/validation
mp.messaging.outgoing.validation-request-out.host=${mqtt.host}
mp.messaging.outgoing.validation-request-out.port=${mqtt.port}

# Ricezione della risposta dal server (IN)
mp.messaging.incoming.validation-response-in.connector=smallrye-mqtt
mp.messaging.incoming.validation-response-in.topic=railway/station/+/validation-response
mp.messaging.incoming.validation-response-in.host=${mqtt.host}
mp.messaging.incoming.validation-response-in.port=${mqtt.port}

# ---------------------------------------------------------------
# CANALE IN USCITA: heartbeat della stazione
# Pubblica su: railway/station/{stazione.id}/heartbeat
# ---------------------------------------------------------------
mp.messaging.outgoing.heartbeat-out.connector=smallrye-mqtt
mp.messaging.outgoing.heartbeat-out.topic=railway/station/${stazione.id}/heartbeat
mp.messaging.outgoing.heartbeat-out.host=${mqtt.host}
mp.messaging.outgoing.heartbeat-out.port=${mqtt.port}

# ---------------------------------------------------------------
# CANALE IN USCITA: notifica transito (ingresso/uscita treno)
# Pubblica su: railway/station/{stazione.id}/transit
# ---------------------------------------------------------------
mp.messaging.outgoing.transit-out.connector=smallrye-mqtt
mp.messaging.outgoing.transit-out.topic=railway/station/${stazione.id}/transit
mp.messaging.outgoing.transit-out.host=${mqtt.host}
mp.messaging.outgoing.transit-out.port=${mqtt.port}

# ---------------------------------------------------------------
# CANALE IN INGRESSO: riceve alert/comandi dalla Centrale
# Si sottoscrive a: railway/alerts
# ---------------------------------------------------------------
# Su questi due canali il QoS non e' lo 0 di default: gli alert passano una volta
# sola e nessuno li ripete, quindi qos=1 (con PUBACK e ritrasmissione) e sessione
# persistente, cosi' un RESOLVED pubblicato mentre il nodo era spento gli arriva
# comunque alla riconnessione invece di lasciarlo GUASTA per sempre. Il criterio
# completo e' commentato nell'application.properties della Centrale.
# Il client-id contiene ${stazione.id} perche' le istanze di questo servizio sono
# piu' di una: due nodi con lo stesso identificativo si scollegherebbero a vicenda.

# INCOMING: alerts from Centrale
mp.messaging.incoming.alerts-in.connector=smallrye-mqtt
mp.messaging.incoming.alerts-in.topic=railway/alerts
mp.messaging.incoming.alerts-in.host=${mqtt.host}
mp.messaging.incoming.alerts-in.port=${mqtt.port}
mp.messaging.incoming.alerts-in.qos=1
mp.messaging.incoming.alerts-in.auto-generated-client-id=false
mp.messaging.incoming.alerts-in.client-id=stazione-${stazione.id}-alerts-in
mp.messaging.incoming.alerts-in.auto-clean-session=false

# OUTGOING: alerts towards Centrale
mp.messaging.outgoing.alerts-out.connector=smallrye-mqtt
mp.messaging.outgoing.alerts-out.topic=railway/alerts
mp.messaging.outgoing.alerts-out.host=${mqtt.host}
mp.messaging.outgoing.alerts-out.port=${mqtt.port}
mp.messaging.outgoing.alerts-out.qos=1
mp.messaging.outgoing.alerts-out.auto-generated-client-id=false
mp.messaging.outgoing.alerts-out.client-id=stazione-${stazione.id}-alerts-out

# ---------------------------------------------------------------
# CANALE IN INGRESSO: passaggi fisici dei treni (wildcard su tutti i treni)
# Si sottoscrive a: railway/train/+/passaggio
# Ogni stazione filtra i soli messaggi con il proprio stazioneId
# ---------------------------------------------------------------
mp.messaging.incoming.passaggio-in.connector=smallrye-mqtt
mp.messaging.incoming.passaggio-in.topic=railway/train/+/passaggio
mp.messaging.incoming.passaggio-in.host=${mqtt.host}
mp.messaging.incoming.passaggio-in.port=${mqtt.port}

# ---------------------------------------------------------------
# Keepalive sensori: dopo quanti secondi senza battito un sensore
# viene considerato guasto e segnalato alla Centrale
# ---------------------------------------------------------------
sensori.timeout.secondi=30

# ===================================================================
# PROFILO TLS (variante 6 del prof) - attivare con -Dquarkus.profile=tls
# Cifra tutti i canali MQTT verso il broker (porta 8883).
# I certificati vanno prima generati con BrokerMosquitto/tls/gen-certs.sh;
# il path del truststore e' relativo alla directory di questo servizio.
# ===================================================================
%tls.mqtt.port=8883

# Sotto questo profilo la Centrale espone l'HTTPS sulla 8444
# (%tls.quarkus.http.ssl-port nel suo application.properties).
%tls.centrale.url=https://localhost:8444

# Ogni canale MQTT valida il certificato del broker contro la CA del progetto.
# ATTENZIONE: vanno elencati TUTTI i canali, compresi quelli di validazione dell'ID:
# sotto profilo tls la porta diventa 8883 per tutti, e un canale senza ssl=true
# aprirebbe una socket in chiaro su un listener TLS (handshake fallito -> la stazione
# non riesce a validarsi e resta bloccata nel loop di main.run()).
%tls.mp.messaging.outgoing.validation-request-out.ssl=true
%tls.mp.messaging.outgoing.validation-request-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.validation-request-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.validation-response-in.ssl=true
%tls.mp.messaging.incoming.validation-response-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.validation-response-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.outgoing.heartbeat-out.ssl=true
%tls.mp.messaging.outgoing.heartbeat-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.heartbeat-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.outgoing.transit-out.ssl=true
%tls.mp.messaging.outgoing.transit-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.transit-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.alerts-in.ssl=true
%tls.mp.messaging.incoming.alerts-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.alerts-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.outgoing.alerts-out.ssl=true
%tls.mp.messaging.outgoing.alerts-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.alerts-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.passaggio-in.ssl=true
%tls.mp.messaging.incoming.passaggio-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.passaggio-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt
