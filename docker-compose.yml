services:
  db:
    image: postgres:15
    container_name: railway-postgres
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Identity Provider del sistema: qui vivono utenti, password e ruoli della
  # Centrale Operativa. La Centrale non verifica le credenziali, si limita a
  # controllare la firma dei token che Keycloak rilascia (vedi Keycloak/README.txt).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: railway-keycloak
    # "start" e non "start-dev": in modalita' di sviluppo Keycloak tiene aperto
    # l'HTTP in chiaro qualunque cosa si scriva in http-enabled, e da qui passano le password degli utenti, quindi RF04.3 non sarebbe
    # rispettato. In modalita' di produzione l'HTTP si spegne davvero e resta il
    # solo listener HTTPS. --import-realm carica il realm "railway" dal file
    # montato sotto, ma SOLO se non esiste gia'.
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # HTTP spento: senza questa riga Keycloak resterebbe in ascolto anche in
      # chiaro sulla 8080 e la cifratura sarebbe solo una porta in piu' invece
      # dell'unico modo per parlargli.
      KC_HTTP_ENABLED: "false"
      # H2 su file: in modalita' di produzione va chiesto esplicitamente, altrimenti Keycloak si aspetta un
      # database vero e si rifiuta di partire. Per un progetto didattico va bene:
      # gli unici dati sono i quattro utenti di prova del realm.
      KC_DB: dev-file
      # In modalita' di produzione l'hostname non si indovina dalla
      # richiesta: va detto, ed e' anche l'issuer che finisce dentro i token
      # ("iss"), quello che la Centrale confronta con keycloak.url.
      KC_HOSTNAME: https://localhost:8543
      KC_HTTPS_PORT: 8443
      # Certificato firmato dalla CA privata del progetto, la stessa del broker e
      # della Centrale (BrokerMosquitto/tls/gen-certs.sh).
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/tls/server-keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/tls/server-keycloak.key
    ports:
      # 8543 sull'host, 8443 nel container.
      - "8543:8443"
    volumes:
      - ./Keycloak/realm-railway.json:/opt/keycloak/data/import/realm-railway.json:ro
      - ./BrokerMosquitto/tls/certs:/opt/keycloak/tls:ro

  # Broker MQTT: e' il canale su cui Stazioni, Treni e Centrale si scambiano i
  # messaggi. Sta qui insieme agli altri servizi cosi' si avvia tutto con un
  # comando solo.
  #   1883 -> MQTT in chiaro
  #   8883 -> MQTT su TLS (profilo "tls", certificati da BrokerMosquitto/tls/gen-certs.sh)
  #   9001 -> MQTT su WebSocket, quello che usa la web app dal browser
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: broker-mosquitto
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./BrokerMosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./BrokerMosquitto/data:/mosquitto/data
      - ./BrokerMosquitto/log:/mosquitto/log
      - ./BrokerMosquitto/tls/certs:/mosquitto/tls/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:
