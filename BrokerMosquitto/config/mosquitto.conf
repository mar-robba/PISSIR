listener 1883
allow_anonymous true

# ---------------------------------------------------------------
# Listener TLS (variante 6): porta 8883 cifrata.
# La 1883 in chiaro resta attiva per retrocompatibilita' in demo.
# I certificati vanno generati con tls/gen-certs.sh e sono montati
# dal docker-compose sotto /mosquitto/tls
# ---------------------------------------------------------------
listener 8883
cafile /mosquitto/tls/certs/ca.crt
certfile /mosquitto/tls/certs/server.crt
keyfile /mosquitto/tls/certs/server.key

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
