listener 1883
allow_anonymous true

# ---------------------------------------------------------------
# Listener TLS (variante 6): porta 8883 cifrata.
# La 1883 in chiaro resta attiva per retrocompatibilita' in demo.
# I certificati vanno generati con tls/gen-certs.sh e sono montati
# dal docker-compose sotto /mosquitto/tls
# ---------------------------------------------------------------
listener 8883
cafile /mosquitto/tls/certs/ca.crt
certfile /mosquitto/tls/certs/server.crt
keyfile /mosquitto/tls/certs/server.key

persistence true
persistence_location /mosquitto/data/

# -------------------------------------------------------------------
# Consegna garantita degli eventi una tantum (alert, comandi)
# -------------------------------------------------------------------
# La persistenza da sola non basta: il QoS lo scelgono i client (vedi qos=1
# sui canali alerts-* nei tre application.properties). Qui si configura cio'
# che serve al broker per onorare quella scelta anche mentre un nodo e' spento.
#
# Salvataggio periodico su disco della coda e delle sessioni: senza, un riavvio
# del broker perde tutto quello che aveva accumulato dall'ultimo autosave.
autosave_interval 60

# Messaggi QoS>=1 messi da parte per un client con sessione persistente che al
# momento della pubblicazione non era collegato. Il default (1000) basterebbe,
# lo si alza perche' la Centrale spenta a lungo accumula alert e STOP.
max_queued_messages 5000

# Le sessioni persistenti dei nodi che non tornano piu' (i treni hanno id
# effimeri tipo tr-1785881107516) verrebbero conservate per sempre insieme alla
# loro coda: dopo un giorno di assenza si buttano.
persistent_client_expiration 1d

# I messaggi QoS 0 NON vengono accodati per i client scollegati, ed e' voluto:
# telemetria e heartbeat sono flussi periodici, una raffica di posizioni vecchie
# consegnata alla riconnessione sarebbe peggio della perdita che evita.
queue_qos0_messages false

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
