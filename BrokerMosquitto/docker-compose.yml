version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: broker-mosquitto
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
      - ./tls/certs:/mosquitto/tls/certs:ro
    restart: unless-stopped
