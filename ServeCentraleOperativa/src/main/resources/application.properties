# ===================================================================
# MICROSERVIZIO CENTRALE OPERATIVA - Configurazione
# ===================================================================
# Lo legge la classe Configurazione. Ogni chiave si puo' sovrascrivere al lancio con -D
# (es. -Dmqtt.port=1884), e le righe che cominciano con %tls. valgono solo quando si lancia
# con -Dprofilo=tls: stessa convenzione di Treni e Stazioni.

# Porta HTTP delle API REST (/api/...) e della WebSocket (/ws/realtime)
http.porta=8781

# CORS: la Centrale risponde a qualsiasi origine (la web app gira su un'altra porta).
# Non ha chiavi qui: e' una riga di ServerRest, che accetta qualsiasi host e le
# intestazioni che il browser chiede.

# ---------------------------------------------------------------
# Autenticazione OAuth2 con Keycloak (SicurezzaKeycloak, pac4j)
# ---------------------------------------------------------------
# La Centrale non verifica nessuna password: e' un "resource server", cioe' riceve il
# JWT che il browser ha ottenuto da Keycloak e ne controlla la firma con le chiavi
# pubbliche del realm (endpoint JWKS, trovato da solo tramite il documento
# .well-known/openid-configuration).
# L'indirizzo e' in https: Keycloak espone soltanto il listener cifrato
# (docker-compose.yml, KC_HTTP_ENABLED=false) perche' su quel canale passano le password
# degli utenti. Vale in tutti i profili, non solo sotto %tls.
keycloak.url=https://localhost:8543/realms/railway
# Il certificato di Keycloak e' firmato dalla CA privata del progetto, che nessun sistema
# conosce: senza questo file la Centrale rifiuterebbe la connessione con "unable to find
# valid certification path".
keycloak.ca=../BrokerMosquitto/tls/certs/ca.crt
# Il token deve essere stato emesso PER queste API: l'audience-mapper del client
# railway-webapp aggiunge "railway-centrale" al claim aud. Cosi' un token preso per un
# altro servizio dello stesso realm qui non vale.
keycloak.audience=railway-centrale
# I ruoli (amministratore, tecnico) Keycloak li mette nel claim realm_access.roles: li
# legge SicurezzaKeycloak.RuoliDelRealm.
# Se all'avvio Keycloak non e' ancora pronto (parte insieme al database) la Centrale non
# muore: riprova a scaricare le chiavi ogni 5 secondi, e intanto le API protette
# rispondono 401.

# ---------------------------------------------------------------
# Database PostgreSQL (JDBC)
# ---------------------------------------------------------------
# Le tabelle che mancano le crea la Centrale all'avvio eseguendo schema.sql (solo
# CREATE ... IF NOT EXISTS: su un database gia' popolato non cambia niente).
db.url=jdbc:postgresql://localhost:5432/railway
db.utente=postgres
db.password=postgres

# ---------------------------------------------------------------
# Fault detection automatica (watchdog: GeneratoreEventiTempo -> GestoreEventi)
# ---------------------------------------------------------------
# Secondi di silenzio heartbeat oltre i quali una stazione e' considerata OFFLINE
fault.heartbeat.timeout.secondi=30
# Secondi senza movimento oltre i quali un treno attivo fuori stazione e' considerato fermo anomalo
fault.treno.fermo.timeout.secondi=90

# ---------------------------------------------------------------
# Certezza della posizione dei convogli (PosizioneConvoglio)
# ---------------------------------------------------------------
# Oltre quanti secondi di silenzio la telemetria di un convoglio e' considerata vecchia:
# da li' in poi la Centrale non garantisce piu' ne' la posizione ne' la direzione e il
# convoglio finisce fra quelli a posizione incerta. Il digital twin trasmette ogni
# secondo, quindi questi 15 sono tutto margine per una riconnessione al broker.
posizione.telemetria.freschezza.secondi=15

# ---------------------------------------------------------------
# Orario di servizio (PrevisioneArrivi)
# ---------------------------------------------------------------
# Con che scala la Centrale legge il cronometro quando calcola ritardi e previsioni
# di arrivo. La simulazione corre accelerata: un minuto dell'orario ferroviario dura
# 60/fattore secondi reali, e i due valori qui sotto sono l'orario che i convogli
# devono rispettare. DEVONO restare uguali a quelli di Treni/application.properties
# (viaggio.fattore.accelerazione, viaggio.sosta.secondi): se la Centrale prevedesse
# con una scala e la flotta viaggiasse con un'altra, ogni treno risulterebbe in
# ritardo (o in anticipo) di una quantita' costante senza che sia successo niente.
viaggio.fattore.accelerazione=100
# Sosta prevista in ogni fermata intermedia, in secondi reali (al capolinea e' doppia)
viaggio.sosta.secondi=2

# ---------------------------------------------------------------
# Connessione al broker Mosquitto (ClientMqtt)
# ---------------------------------------------------------------
# La Centrale apre UNA connessione, con il client-id qui sotto, e su quella:
#   ascolta    railway/train/+/telemetry            (telemetria dei treni, QoS 0)
#              railway/station/+/heartbeat          (battito delle stazioni, QoS 0)
#              railway/station/+/transit            (passaggi rilevati dalle stazioni, QoS 0)
#              railway/train/+/validation           (richieste di verifica dell'ID, QoS 0)
#              railway/station/+/validation         (idem per le stazioni, QoS 0)
#              railway/alerts                       (GUASTO e RESOLVED del campo, QoS 1)
#   pubblica   railway/alerts                       (guasti dedotti, RESOLVED, STOP, RITARDO,
#                                                    STATO_STAZIONE, ITINERARIO_AGGIORNATO..., QoS 1)
#              railway/train/<ID>/validation-response    (risposta, QoS 0)
#              railway/station/<ID>/validation-response  (risposta, QoS 0)
mqtt.host=localhost
mqtt.port=1883
# ATTENZIONE: due processi con lo stesso client-id si scollegano a vicenda. Per provare una
# seconda Centrale accanto a quella accesa va cambiato (-Dmqtt.client-id=...), oltre alla porta.
mqtt.client-id=centrale-operativa
mqtt.ca=../BrokerMosquitto/tls/certs/ca.crt

# ===================================================================
# QoS: due nature di messaggio, due livelli di garanzia
# ===================================================================
# Per telemetria, heartbeat e transiti basta qos=0 (at most once): sono flussi
# periodici, un frame perduto viene rimpiazzato dal successivo pochi secondi dopo, e
# alzare il QoS aggiungerebbe un PUBACK ogni secondo per treno.
#
# Gli alert NO: GUASTO, RESOLVED, STOP e ITINERARIO_AGGIORNATO passano UNA volta
# sola e nessuno li ripete. Se si perdono, un treno non sa che la stazione davanti
# e' inagibile, oppure resta trattenuto per un guasto che e' gia' stato risolto.
# Su questi serve qos=1 (at least once, con PUBACK e ritrasmissione): la Centrale li
# pubblica e li ascolta a QoS 1, e se il broker e' giu' CodaPubblicazioni li riprova.
#
# Il qos da solo pero' non copre il nodo SPENTO nell'istante della pubblicazione:
# per quello serve una sessione persistente, cioe' un client-id stabile (quello qui
# sopra) e cleanSession=false (lo imposta ClientMqtt), cosi' il broker tiene la coda e
# gliela consegna alla riconnessione (vedi max_queued_messages e
# persistent_client_expiration in BrokerMosquitto/config/mosquitto.conf).
#
# Conseguenza da tenere presente: at least once vuol dire che un duplicato e'
# possibile. Sugli alert e' innocuo, perche' il gestore deduplica per (sorgente, tipo)
# e i comandi sono idempotenti. E' il motivo per cui i transiti restano a QoS 0: un
# ingresso duplicato aprirebbe due righe Transito, quindi va reso idempotente PRIMA di
# alzargli il livello.

# ===================================================================
# PROFILO TLS (variante 6 del prof) - attivare con -Dprofilo=tls
# Cifra MQTT verso il broker (porta 8883) e abilita l'HTTPS della Centrale.
# I certificati vanno prima generati con BrokerMosquitto/tls/gen-certs.sh;
# i percorsi sono relativi alla directory di questo servizio.
# ===================================================================
%tls.mqtt.port=8883
# Connessione ssl:// validata contro la CA del progetto (mqtt.ca)
%tls.mqtt.tls=true

# HTTPS della Centrale: certificato dedicato generato dallo stesso script.
# La porta 8781 in chiaro resta attiva accanto alla 8444, come prima.
%tls.https.porta=8444
%tls.https.certificato=../BrokerMosquitto/tls/certs/server-centrale.crt
%tls.https.chiave=../BrokerMosquitto/tls/certs/server-centrale.key
