# ===================================================================
# MICROSERVIZIO CENTRALE OPERATIVA (Quarkus)
# ===================================================================
quarkus.http.port=8781

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization

# ---------------------------------------------------------------
# Configurazione Database PostgreSQL
# ---------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/railway
quarkus.hibernate-orm.database.generation=update
#È un'impostazione di configurazione (che si trova o si inserisce nel file application.properties) e serve a dire a Hibernate se stampare o meno nel terminale le query SQL che genera ed esegue dietro le quinte.
#quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------
# Fault detection automatica (FaultMonitor)
# ---------------------------------------------------------------
# Secondi di silenzio heartbeat oltre i quali una stazione e' considerata OFFLINE
fault.heartbeat.timeout.secondi=30
# Secondi senza movimento oltre i quali un treno attivo fuori stazione e' considerato fermo anomalo
fault.treno.fermo.timeout.secondi=90

# ---------------------------------------------------------------
# Connessione al broker Mosquitto
# ---------------------------------------------------------------
mqtt.host=localhost
mqtt.port=1883





# Sottoscrizione Della conferma o non conferma dell'esistenza nel dib delle entità che lo hanno richiesto
mp.messaging.incoming.validation-in.connector=smallrye-mqtt
mp.messaging.incoming.validation-in.topic=railway/train/+/validation
mp.messaging.incoming.validation-in.host=${mqtt.host}
mp.messaging.incoming.validation-in.port=${mqtt.port}
# ---------------------------------------------------------------
# SOTTOSCRIZIONE (IN) ai canali di telemetry (Treni)
# ------------------------------------------
# Breve spiegazione di come si configura il "topic automatico di quarqu"
# kmp.messaging.incoming.telemetry-in.connector=smallrye-mqtt
#    Definisce il canale in entrata (incoming) chiamato telemetry-in. Il "connettore" dice al framework: "Usa MQTT per ricevere i messaggi su questo canale".
#
#    mp.messaging.incoming.telemetry-in.topic=railway/train/+/telemetry
#    È il topic MQTT a cui ci si iscrive. Il carattere + è un wildcard a singolo livello: significa che questo canale riceverà messaggi da railway/train/treno123/telemetry, railway/train/trenoABC/telemetry, ecc.
#
#    mp.messaging.incoming.telemetry-in.host=${mqtt.host}
#    Indirizzo del broker MQTT. ${mqtt.host} significa che il valore viene preso da una variabile d'ambiente o da un'altra proprietà (es. mqtt.host=localhost).
#
#    mp.messaging.incoming.telemetry-in.port=${mqtt.port}
#    Porta del broker MQTT (solitamente 1883 o 8883 per TLS).---------------------


# Publicazione Della conferma o non conferma dell'esistenza nel dib delle entità che lo hanno richiesto
# ----------------------------------------------
# INVIO (Outgoing) - NON mettere il topic qui!
# Lo gestiamo dinamicamente in Java con l'Emitter.
# ----------------------------------------------
mp.messaging.outgoing.validation-response.connector=smallrye-mqtt
mp.messaging.outgoing.validation-response.host=${mqtt.host}
mp.messaging.outgoing.validation-response.port=${mqtt.port}

# ---------------------------------------------------------------
# VERIFICA ID STAZIONE via MQTT (stesso pattern del Treno,
# gestita da ExistIdForEdgeStazione)
# ---------------------------------------------------------------
mp.messaging.incoming.validation-station-in.connector=smallrye-mqtt
mp.messaging.incoming.validation-station-in.topic=railway/station/+/validation
mp.messaging.incoming.validation-station-in.host=${mqtt.host}
mp.messaging.incoming.validation-station-in.port=${mqtt.port}

# INVIO (Outgoing) - topic dinamico gestito in Java con l'Emitter
mp.messaging.outgoing.validation-station-response.connector=smallrye-mqtt
mp.messaging.outgoing.validation-station-response.host=${mqtt.host}
mp.messaging.outgoing.validation-station-response.port=${mqtt.port}



mp.messaging.incoming.telemetry-in.connector=smallrye-mqtt
mp.messaging.incoming.telemetry-in.topic=railway/train/+/telemetry
mp.messaging.incoming.telemetry-in.host=${mqtt.host}
mp.messaging.incoming.telemetry-in.port=${mqtt.port}

# ---------------------------------------------------------------
# SOTTOSCRIZIONE (IN) ai canali di transit (Stazioni)
# ---------------------------------------------------------------
mp.messaging.incoming.transit-in.connector=smallrye-mqtt
mp.messaging.incoming.transit-in.topic=railway/station/+/transit
mp.messaging.incoming.transit-in.host=${mqtt.host}
mp.messaging.incoming.transit-in.port=${mqtt.port}

# ---------------------------------------------------------------
# SOTTOSCRIZIONE (IN) ai canali di heartbeat (Stazioni)
# ---------------------------------------------------------------
mp.messaging.incoming.heartbeat-in.connector=smallrye-mqtt
mp.messaging.incoming.heartbeat-in.topic=railway/station/+/heartbeat
mp.messaging.incoming.heartbeat-in.host=${mqtt.host}
mp.messaging.incoming.heartbeat-in.port=${mqtt.port}




# ---------------------------------------------------------------
# PUBBLICAZIONE (OUT) allarmi (Verso tutti)
# ---------------------------------------------------------------
mp.messaging.outgoing.alerts-out.connector=smallrye-mqtt
mp.messaging.outgoing.alerts-out.topic=railway/alerts
mp.messaging.outgoing.alerts-out.host=${mqtt.host}
mp.messaging.outgoing.alerts-out.port=${mqtt.port}

# ---------------------------------------------------------------
# SOTTOSCRIZIONE (IN) allarmi (Dai treni/stazioni)
# ---------------------------------------------------------------
mp.messaging.incoming.alerts-in.connector=smallrye-mqtt
mp.messaging.incoming.alerts-in.topic=railway/alerts
mp.messaging.incoming.alerts-in.host=${mqtt.host}
mp.messaging.incoming.alerts-in.port=${mqtt.port}

# ---------------------------------------------------------------
# SOTTOSCRIZIONE (IN) passaggi treni
# ---------------------------------------------------------------
mp.messaging.incoming.passaggio-in.connector=smallrye-mqtt
mp.messaging.incoming.passaggio-in.topic=railway/train/+/passaggio
mp.messaging.incoming.passaggio-in.host=${mqtt.host}
mp.messaging.incoming.passaggio-in.port=${mqtt.port}

# ===================================================================
# PROFILO TLS (variante 6 del prof) - attivare con -Dquarkus.profile=tls
# Cifra MQTT verso il broker (porta 8883) e abilita HTTPS della Centrale.
# I certificati vanno prima generati con BrokerMosquitto/tls/gen-certs.sh;
# il path del truststore e' relativo alla directory di questo servizio.
# ===================================================================
%tls.mqtt.port=8883

# Ogni canale MQTT valida il certificato del broker contro la CA del progetto
%tls.mp.messaging.incoming.telemetry-in.ssl=true
%tls.mp.messaging.incoming.telemetry-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.telemetry-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.transit-in.ssl=true
%tls.mp.messaging.incoming.transit-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.transit-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.heartbeat-in.ssl=true
%tls.mp.messaging.incoming.heartbeat-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.heartbeat-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.outgoing.alerts-out.ssl=true
%tls.mp.messaging.outgoing.alerts-out.ssl.truststore.type=pem
%tls.mp.messaging.outgoing.alerts-out.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.alerts-in.ssl=true
%tls.mp.messaging.incoming.alerts-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.alerts-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

%tls.mp.messaging.incoming.passaggio-in.ssl=true
%tls.mp.messaging.incoming.passaggio-in.ssl.truststore.type=pem
%tls.mp.messaging.incoming.passaggio-in.ssl.truststore.location=../BrokerMosquitto/tls/certs/ca.crt

# HTTPS della Centrale: certificato dedicato generato dallo stesso script.
# La porta 8781 in chiaro resta attiva (insecure-requests=enabled) per la demo.
%tls.quarkus.http.ssl-port=8444
%tls.quarkus.http.ssl.certificate.files=../BrokerMosquitto/tls/certs/server-centrale.crt
%tls.quarkus.http.ssl.certificate.key-files=../BrokerMosquitto/tls/certs/server-centrale.key
%tls.quarkus.http.insecure-requests=enabled
