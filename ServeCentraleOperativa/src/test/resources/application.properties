quarkus.http.host=127.0.0.1
quarkus.http.port=0
quarkus.http.test-port=0

# ===================================================================
# DATABASE DEI TEST
# ===================================================================
# I test girano su un H2 in memoria, creato all'avvio della suite e buttato via alla
# fine. Prima questo file conteneva solo host e porta HTTP: non essendoci nessun
# override del datasource i test usavano jdbc:postgresql://localhost:5432/railway, cioe'
# ESATTAMENTE il database dell'esecuzione normale. AdminApiTest e ItinerariTratteTest
# creano davvero stazioni, tratte e treni (STAZ_TEST_xxxx, IT_A_xxxx...): la pulizia
# finale c'e', ma vale solo se la sequenza arriva in fondo, quindi bastava un test rotto
# a lasciare righe di prova nei dati di lavoro. E senza Postgres acceso i test non
# partivano affatto.
#
# Con H2 in memoria non serve nessun servizio esterno: "./mvnw test" gira sempre, ogni
# esecuzione parte da uno schema pulito e i dati di lavoro non vengono toccati.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:railway-test;DB_CLOSE_DELAY=-1

# Lo schema lo genera Hibernate dalle entita' a ogni esecuzione (in produzione resta
# "update" sul Postgres vero).
quarkus.hibernate-orm.database.generation=drop-and-create
# Nomi di tabelle e colonne sempre fra virgolette: lo schema usa parole che in H2 2.x
# sono riservate (la colonna "timestamp" di eventi_stazioni), e senza quoting la
# creazione dello schema fallirebbe.
quarkus.hibernate-orm.database.globally-quoted-identifiers=true
# Nessun dato precaricato: i test si creano quello che serve e lo cancellano.
quarkus.hibernate-orm.sql-load-script=no-file
